<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdf6e3" />
    <title>Problem repository</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <div>
          <p class="eyebrow">Competitive programming</p>
          <h1>Problem repository</h1>
        </div>
        <button
          class="button download-button"
          id="download-button"
          type="button"
          aria-label="Download library data"
          title="Download library data"
        >
          <svg aria-hidden="true" viewBox="0 0 32 32">
            <path d="M16 3v19" />
            <path d="m8 15 8 9 8-9" />
          </svg>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <div id="status" class="status" role="status" aria-live="polite">Loading library…</div>
      <nav class="tabs" aria-label="Library sections" id="section-tabs"></nav>
      <section class="library-panel" aria-label="Problem library">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Current location</p>
            <nav aria-label="Breadcrumb" id="breadcrumb"></nav>
          </div>
          <span class="item-count" id="item-count"></span>
        </div>
        <div class="entry-grid" id="entries"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
